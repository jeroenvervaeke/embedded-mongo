[workspace]
members = ["embedded-mongodb-android", "embedded-mongodb-python", "embedded-mongodb-sys"]
resolver = "3"

[package]
name = "embedded-mongodb"
version = "0.1.0"
edition = "2024"
description = "SQLite-like embedded MongoDB client"
repository = "https://github.com/jeroenvervaeke/embedded-mongo"
license = "SSPL-1.0"
publish = false
exclude = ["mongo"]

[dependencies]
bson = { version = "3.1.0", features = ["serde"] }
embedded-mongodb-sys = { path = "embedded-mongodb-sys" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1"
tempfile = "3"
tracing-subscriber = "0.3"

[[bench]]
name = "operations"
harness = false

[profile.release]
lto = "thin"
strip = "symbols"
