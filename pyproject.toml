[build-system]
requires = ["maturin[patchelf]>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pymongo-embedded"
version = "0.1.0"
description = "Run PyMongo against an in-process embedded MongoDB engine"
readme = "README.md"
requires-python = ">=3.9"
license = "SSPL-1.0"
dependencies = ["pymongo>=4.18,<4.19"]

[tool.maturin]
manifest-path = "embedded-mongodb-python/Cargo.toml"
module-name = "pymongo_embedded._native"
python-source = "python"
auditwheel = "repair"
compatibility = "manylinux_2_39"
