name: native

# Builds the MongoDB engine for every published target, proves each library loads, publishes
# them as a GitHub release keyed on the source commit, and commits the regenerated manifest
# back. This is the only place the engine is compiled; ci.yml consumes what this produces.
#
# Dispatch only, deliberately. A build takes hours against a hard six-hour job cap, and
# publishing conveys the work in object form under the SSPL -- neither belongs on a push
# trigger. Leaving `publish` off gives a build-and-validate run across all four targets, which
# is what to use for a dry run or to measure wall-clock before committing to a release.
#
# Nothing here fires automatically, so a change to the engine reaches ci.yml as a freshness
# failure naming this workflow rather than as a surprise multi-hour run.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release and commit the manifest
        type: boolean
        default: false
      reuse_run:
        description: >-
          Run ID to take already-built libraries from, skipping the compile. For iterating on
          the steps after the build, which take seconds and have repeatedly been what fails.
          Never use it for the run that publishes: those artifacts must come from a build of
          this exact tree.
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Anchored on docs/native-size-reduction.md: the patched Linux library is
          # 33,139,904 bytes and the same build without the patches is 44,885,600, so a
          # single wide band would pass the exact artifact it exists to reject. Static
          # libstdc++ adds roughly 2.4 MB on top.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            min_size: 30000000
            max_size: 40000000
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            min_size: 30000000
            max_size: 42000000
          # macOS gets neither LTO nor the version script -- native/BUILD.bazel gates both on
          # @platforms//os:linux -- so it cannot share a band. Start wide, record the real
          # figure on the first green run, then tighten. The ceiling's real job here is
          # catching a ~1.4 GB debug build.
          #
          # No x86_64-apple-darwin. That runner never completed a build: at three Bazel jobs
          # it crashed, and at two it reached 5,609 of 6,299 actions before hitting the
          # six-hour job cap. GitHub retires the Intel image in August 2027 in any case, so
          # Intel Mac users build from source. Re-adding it is one entry here plus a
          # republish, and nothing in the design assumes a fixed target set.
          - target: aarch64-apple-darwin
            runner: macos-15
            min_size: 25000000
            max_size: 90000000
          # Both Android ABIs cross-compile from the same x86_64 runner: the NDK's clang
          # targets either from any host, so there is no arm64 leg to wait on. They get
          # --gc-sections and the version script like the other Linux targets, but no LTO --
          # those flags are GCC/bfd-specific and lld cannot read GCC's IR -- so they land
          # around 47 MB rather than 34.
          - target: aarch64-linux-android
            runner: ubuntu-24.04
            android: 'yes'
            min_size: 35000000
            max_size: 60000000
          - target: x86_64-linux-android
            runner: ubuntu-24.04
            android: 'yes'
            min_size: 35000000
            max_size: 60000000
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Make room for the build
        if: inputs.reuse_run == ''
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = Linux ]; then
            # Disk is not the constraint it was assumed to be: the image has a 145 GB root
            # with over 100 GB free and no separate /mnt volume, against an output base of
            # about 17 GB. So nothing is deleted and nothing is relocated.
            #
            # Memory is the constraint. Both Linux legs of the first run were killed at
            # roughly three hours with 'The runner has received a shutdown signal' and exit
            # 143, which is what an out-of-memory kill looks like from inside a job: the
            # whole-program LTO phase runs after every object is compiled, and its peak lands
            # near this runner's 16 GB. Swap is free here and absorbs the spike.
            # A second swapfile, not /swapfile: the image already ships one and has it
            # active, so writing to that path fails with 'fallocate failed: Text file busy'.
            if ! swapon --show=NAME --noheadings | grep -qx /swapfile-ci; then
              sudo fallocate -l 24G /swapfile-ci \
                || sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=24576 status=none
              sudo chmod 600 /swapfile-ci
              sudo mkswap /swapfile-ci > /dev/null
              sudo swapon /swapfile-ci
            fi
            # Fail here rather than three hours later: without the extra swap this build is
            # expected to be killed during the whole-program LTO phase.
            total=$(free -g | awk '/^Swap:/ {print $2}')
            test "$total" -ge 20 || { echo "only ${total}G swap available" >&2; exit 1; }
          fi
          # macOS has the least room and no second volume, and an ENOSPC there surfaces as an
          # opaque Bazel crash that never mentions disk.
          df -h
          if [ "${{ runner.os }}" = Linux ]; then free -h; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - name: Check out the MongoDB submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 mongo
          test "$(git -C mongo rev-parse HEAD)" = "$(git rev-parse HEAD:mongo)" \
            || { echo 'submodule checkout does not match the committed gitlink' >&2; exit 1; }

      - name: Restore the Bazel bootstrap caches
        if: inputs.reuse_run == ''
        uses: actions/cache@v4
        with:
          # Small and written once per submodule bump; the patches provably touch neither
          # .bazelversion nor MODULE.bazel.lock, so patch iteration cannot invalidate it.
          # Both bazelisk paths: it uses Library/Caches on macOS, and a Linux-only path there
          # silently re-downloads the pinned Bazel fork every run. python3-venv and uv are
          # here because mongo's bazelisk wrapper hook runs `uv sync` from PyPI on every cold
          # invocation, which is a network bootstrap on the critical path of a long job.
          path: |
            ~/.cache/bazelisk
            ~/Library/Caches/bazelisk
            ~/.cache/uv
            mongo/python3-venv
          key: bazel-bootstrap-${{ matrix.target }}-${{ hashFiles('mongo/.bazelversion', 'mongo/.bazeliskrc', 'mongo/MODULE.bazel.lock', 'mongo/uv.lock') }}

      - name: Install the LLVM toolchain the Apple build needs
        if: runner.os == 'macOS' && inputs.reuse_run == ''
        run: |
          set -euo pipefail
          # MongoDB's Apple toolchain resolves its compiler through Homebrew: it runs
          # `brew --prefix llvm@$LLVM_VERSION` and the same for lld, and fails during
          # analysis -- before compiling anything -- when either is missing. Xcode's own
          # clang does not satisfy it, and neither is preinstalled on the runner images.
          #
          # The version is read from the same rcfile the toolchain reads, so this cannot
          # drift from what Bazel will ask for on a submodule bump.
          version=$(sed -n 's/^common:macos --repo_env=LLVM_VERSION=\([0-9][0-9]*\).*/\1/p' \
                    mongo/.bazelrc | head -1)
          test -n "$version" || { echo 'no LLVM_VERSION in mongo/.bazelrc' >&2; exit 1; }
          echo "mongo/.bazelrc asks for LLVM $version"
          brew install "llvm@$version" "lld@$version"
          # Assert the paths the toolchain will look for, so a Homebrew layout change fails
          # here with a clear message rather than inside a Bazel repository fetch.
          brew --prefix "llvm@$version"
          brew --prefix "lld@$version"

      - name: Install MongoDB's Bazel
        if: inputs.reuse_run == ''
        run: |
          set -euo pipefail
          # .bazelversion pins a MongoDB fork that the preinstalled Bazelisk cannot resolve,
          # so this download is a hard dependency of every cold build.
          python3 mongo/buildscripts/install_bazel.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply the MongoDB patches
        if: inputs.reuse_run == ''
        run: ./scripts/apply-mongo-patches

      - name: Reuse an earlier build
        # Skips the compile and takes the library and the link params from a previous run, so
        # the steps below -- which take seconds, and are what has repeatedly failed -- can be
        # iterated in minutes instead of hours. The submodule is still checked out above,
        # because the notices need the vendored licence texts.
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.reuse_run }}" \
            --repo "${{ github.repository }}" \
            --name "native-${{ matrix.target }}" --dir .
          test -s stage/libembedded_mongodb_native.so \
            || { echo 'reused artifact has no library' >&2; ls -R . | head -40 >&2; exit 1; }
          chmod 0644 stage/libembedded_mongodb_native.so
          mkdir -p dist
          echo "reused $(wc -c < stage/libembedded_mongodb_native.so) bytes from run ${{ inputs.reuse_run }}"

      - name: Point the build at the Android NDK
        if: matrix.android
        uses: ./.github/actions/android-ndk
        with:
          target: ${{ matrix.target }}

      - name: Build the native library
        id: bazel
        if: inputs.reuse_run == ''
        # The platform cap is 360. Stopping short of it leaves the assertions and the smoke
        # test room to run and say something, instead of a bare cancellation.
        timeout-minutes: 320
        env:
          EMBEDDED_MONGODB_BUILD_FROM_SOURCE: '1'
          # build_native.rs defaults to 8, which oversubscribes every runner here. macos-15
          # is the smallest at 3 vCPU.
          EMBEDDED_MONGODB_BAZEL_JOBS: ${{ runner.os == 'macOS' && '3' || '4' }}
        run: |
          set -euo pipefail
          # The Android toolchain is already in the environment; the step above put it
          # there. Everything else compiles for the host.
          cargo_target=''
          if [ -n "${{ matrix.android }}" ]; then
            cargo_target="--target ${{ matrix.target }}"
          elif [ "${{ runner.os }}" = Linux ]; then
            # The image ships 12, 13 and 14; unsuffixed gcc is 13, below mongo's 14.2 floor,
            # while manylinux_2_39 tolerates at most 14. Exactly one usable version.
            export CC=gcc-14 CXX=g++-14
          else
            export CC=clang CXX=clang++
          fi

          mkdir -p stage dist

          # A resource sample every two minutes. The first run produced no output at all
          # between the build starting and the runner being killed three hours later, which
          # left nothing to diagnose: cargo buffers a build script's output until it
          # finishes, so Bazel's progress never reached the log. -vv below fixes the
          # buffering; this fixes the other half, by recording what memory and disk were
          # doing at the moment things stopped.
          if [ "${{ runner.os }}" = Linux ]; then
            ( while :; do
                echo "[sample $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/ {print "mem "$3"/"$2"MB"} /^Swap:/ {print "swap "$3"/"$2"MB"}' | tr '\n' ' ')disk $(df -m --output=avail / | tail -1)MB"
                sleep 120
              done ) &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
          fi

          # Take the library from the OUT_DIR cargo reports, never from mongo/bazel-bin: that
          # is a mutable symlink into the output base and can point at an artifact from an
          # entirely different configuration.
          #
          # -vv so the build script's output streams instead of being buffered until it
          # exits. Bazel's progress is the only signal this step produces for hours, and
          # without it a killed runner leaves a silent log. That progress is on stderr, so it
          # reaches the log regardless of what stdout does here.
          #
          # stdout goes straight to a file rather than through a pipe. -vv also echoes the
          # build script's emitted lines onto stdout, interleaved with the JSON: piping that
          # into jq killed jq on the first one two minutes in, and pipefail then failed the
          # step 2h40m later when cargo finally exited -- after a build that had succeeded.
          cargo build --release -vv -p embedded-mongodb-sys $cargo_target \
            --message-format=json > build.jsonl

          # fromjson? skips those interleaved lines instead of dying on them.
          out_dir=$(jq -Rr 'fromjson?
                           | select(.reason=="build-script-executed")
                           | select(.package_id | test("embedded-mongodb-sys"))
                           | .out_dir' build.jsonl | tail -1)
          test -n "$out_dir" || { echo 'could not locate the sys crate OUT_DIR' >&2; exit 1; }

          # -L: on Linux the entry in OUT_DIR is a symlink into the output base.
          cp -L "$out_dir/libembedded_mongodb_native.so" stage/libembedded_mongodb_native.so
          chmod 0644 stage/libembedded_mongodb_native.so
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

          # Only Linux, and only because the notices step needs it. On macOS build.rs copies
          # the library into OUT_DIR instead of symlinking -- it has to, in order to rewrite
          # LC_ID_DYLIB and re-sign it -- so resolving that path lands in the target
          # directory, not the Bazel output tree, and there is no params file to find. The
          # notices are assembled on x86_64 Linux only, so nothing here is lost.
          if [ "${{ runner.os }}" = Linux ]; then
            # Take a copy of the link params file now, rather than resolving paths to it later.
            # Two consecutive runs failed at the last step for the same underlying reason --
            # the params file was not where a later step looked -- because the smoke test
            # re-runs the build script with EMBEDDED_MONGODB_NATIVE_LIB_DIR=stage and repoints
            # the symlink in OUT_DIR at stage/. Copying it here, while the output tree is still
            # intact, removes the whole class: nothing downstream resolves a Bazel path at all.
            real=$(readlink -f "$out_dir/libembedded_mongodb_native.so")
            execroot=${real%%/bazel-out/*}
            echo "library:  $real"
            echo "execroot: $execroot"
            params=$(find "$(dirname "$real")" -maxdepth 1 -name '*.params' -type f 2>/dev/null \
                     | head -1 || true)
            [ -n "$params" ] || params=$(find "$execroot/bazel-out" \
                     -name 'libembedded_mongodb_native.so*.params' -type f 2>/dev/null \
                     | head -1 || true)
            if [ -z "$params" ]; then
              echo "no link params file found for $real" >&2
              echo "--- beside the library ---" >&2
              ls -la "$(dirname "$real")" >&2 || true
              echo "--- params files anywhere in the output tree ---" >&2
              find "$execroot/bazel-out" -name '*.params' -type f 2>/dev/null | head -20 >&2 || true
              exit 1
            fi
            echo "params:   $params ($(wc -l < "$params") lines)"
            cp "$params" stage/link.params
            echo "execroot=$execroot" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the macOS install name
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          lib=stage/libembedded_mongodb_native.so
          # build.rs rewrote LC_ID_DYLIB in OUT_DIR to that job's absolute path, which is
          # meaningless anywhere else. Put it back to what the artifact must ship with; the
          # library is linked with -headerpad_max_install_names so this always fits.
          install_name_tool -id @rpath/libembedded_mongodb_native.so "$lib"
          codesign --force --sign - "$lib"
          otool -D "$lib"
          otool -D "$lib" | grep -qx '@rpath/libembedded_mongodb_native.so'
          codesign -v --verbose=4 "$lib"
          lipo -archs "$lib"
          file "$lib"

      - name: Assert the library size
        run: |
          set -euo pipefail
          size=$(wc -c < stage/libembedded_mongodb_native.so)
          echo "${{ matrix.target }} is $size bytes"
          test "$size" -ge ${{ matrix.min_size }} \
            || { echo 'too small: a broken link produces a few KB and reports success' >&2; exit 1; }
          test "$size" -le ${{ matrix.max_size }} \
            || { echo 'too large: patches not applied, or a debug build' >&2; exit 1; }

      - name: Check the glibc and C++ ABI floor
        id: floor
        if: runner.os == 'Linux' && !matrix.android
        run: |
          set -euo pipefail
          # maturin will not catch this. It keeps the requested manylinux tag when no policy
          # satisfies the library, so a bad wheel installs cleanly and dies at import.
          needs=$(readelf --wide -V stage/libembedded_mongodb_native.so \
                  | grep -oE 'Name: [A-Z_]+_[A-Za-z0-9_.]+' | sed 's/^Name: //' | sort -u)
          echo "$needs"
          # -static-libstdc++ -static-libgcc should have removed these entirely.
          ! grep -qE '^(GLIBCXX|CXXABI|GCC)_' <<<"$needs" \
            || { echo 'the C++ runtime is still dynamically linked' >&2; exit 1; }
          # Fail on anything unrecognised rather than quietly ignoring it.
          # Three-component versions are real: GLIBC_2.2.5, GLIBC_2.3.2, GLIBC_2.3.4 all
          # appear on x86_64. aarch64 has none of them, its ABI baseline being 2.17, which
          # is why only the x86_64 leg failed this check.
          unknown=$(grep -vE '^GLIBC_(2\.[0-9]+(\.[0-9]+)?|ABI_DT_RELR)$' <<<"$needs" || true)
          test -z "$unknown" || { echo "unrecognised version needs: $unknown" >&2; exit 1; }
          max=$(grep -oE '^GLIBC_2\.[0-9]+(\.[0-9]+)?$' <<<"$needs" | sort -uV | tail -1)
          test "$(printf '%s\nGLIBC_2.39\n' "$max" | sort -uV | tail -1)" = 'GLIBC_2.39' \
            || { echo "glibc floor $max is above GLIBC_2.39" >&2; exit 1; }
          echo "glibc floor: $max"
          echo "glibc_min=${max#GLIBC_}" >> "$GITHUB_OUTPUT"

      - name: Check the Android library against bionic
        if: matrix.android
        run: |
          set -euo pipefail
          lib=stage/libembedded_mongodb_native.so
          sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          sysroot=$sysroot/${{ matrix.target }}
          api=$ANDROID_API_LEVEL

          # Deliberately not `file`: whether it prints the .note.android.ident line depends
          # on the runner's libmagic, and ubuntu-24.04's does not read the note NDK r29
          # writes. These three are the properties that actually distinguish a bionic build,
          # and none of them moves with a toolchain version.
          case '${{ matrix.target }}' in
            aarch64-*) want=AArch64 ;;
            x86_64-*) want='Advanced Micro Devices X86-64' ;;
            *) echo 'no expected ELF machine for this target' >&2; exit 1 ;;
          esac
          machine=$(readelf -h "$lib" | sed -n 's/^ *Machine: *//p')
          test "$machine" = "$want" \
            || { echo "built for '$machine', wanted '$want'" >&2; exit 1; }
          # bionic ships libc.so, not libc.so.6, and carries no symbol versioning at all --
          # a library accidentally linked against glibc would have both.
          readelf -d "$lib" | grep NEEDED
          ! readelf -d "$lib" | grep -qE 'lib[a-z+_]+\.so\.[0-9]' \
            || { echo 'linked against glibc rather than bionic' >&2; exit 1; }
          test -z "$(readelf --wide -V "$lib" | grep -oE 'Name: [A-Za-z_]+_[A-Za-z0-9_.]+')" \
            || { echo 'the library carries symbol version needs; bionic has none' >&2; exit 1; }
          # -static-libstdc++ should have taken the C++ runtime in. A NEEDED here would push
          # libc++_shared.so onto every consumer of the engine.
          ! readelf -d "$lib" | grep -q 'libc++_shared' \
            || { echo 'the C++ runtime is still dynamically linked' >&2; exit 1; }
          # The version script leaves exactly the six entry points declared in
          # embedded_mongodb_native.h. An exact count rather than a floor: an accidental
          # export is a --gc-sections root, which is what the version script exists to stop.
          exports=$(nm -D --defined-only "$lib" | grep -c ' T embedded_mongodb_' || true)
          test "$exports" -eq 6 \
            || { echo "expected 6 exported entry points, found $exports" >&2; exit 1; }

          # A shared library records what it needs but is never asked to resolve it until a
          # process loads it, so a missing bionic symbol is invisible to the link and fatal at
          # dlopen. Resolve every one of them here against the NDK's own stubs for this API
          # level, which is the same set the device provides.
          nm -D --undefined-only "$lib" | awk '$1 == "U" {sub(/@.*/, "", $2); print $2}' \
            | sort -u > wanted.txt
          for stub in libc.so libm.so libdl.so; do
            nm -D --defined-only "$sysroot/$api/$stub"
          done | awk 'NF > 1 {sub(/@.*/, "", $NF); print $NF}' | sort -u > provided.txt
          missing=$(comm -23 wanted.txt provided.txt)
          # Weak undefined symbols are the exception: zstd declares four optional tracing
          # hooks it never defines, and the loader is content to leave them null.
          weak=$(nm -D "$lib" | awk '$1 == "w" {sub(/@.*/, "", $2); print $2}' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$missing" | sed '/^$/d') \
                             <(printf '%s\n' "$weak" | sed '/^$/d'))
          test -z "$missing" \
            || { echo "not provided by bionic at API $api:" >&2; echo "$missing" >&2; exit 1; }
          echo "all $(wc -l < wanted.txt) imported symbols resolve against bionic API $api"

      - name: Smoke test -- load the library and run the suite
        if: '!matrix.android'
        env:
          EMBEDDED_MONGODB_NATIVE_LIB_DIR: ${{ github.workspace }}/stage
        run: |
          # Nothing above opens the library. A size band and a symbol table do not prove the
          # engine initialises, and a linked-but-dead blob is a real failure mode here.
          cargo test --release --all-targets

      - name: Smoke test -- run the suite on an Android emulator
        # x86_64 only. The emulator runs arm64 images through full-system emulation, which
        # takes this suite from seconds to well past any sensible job budget; the two ABIs
        # come off the same sources and the same flags, so what this proves for one is what
        # the symbol check above proves for the other.
        if: matrix.target == 'x86_64-linux-android'
        timeout-minutes: 30
        env:
          EMBEDDED_MONGODB_NATIVE_LIB_DIR: ${{ github.workspace }}/stage
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo 'no /dev/kvm on this runner' >&2; exit 1; }
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          # The image the emulator runs, not the one the library targets: an API 24 binary
          # runs on any later Android, and the older system images are slower to boot and no
          # longer carry an x86_64 variant for every tag.
          # avdmanager and the emulator disagree about where AVDs live when only
          # ANDROID_SDK_HOME is set -- one writes $ANDROID_SDK_HOME/.android/avd, the other
          # reads $ANDROID_SDK_HOME/avd -- and the emulator then reports the AVD as simply
          # unknown. Both honour ANDROID_AVD_HOME ahead of everything else, so naming it
          # settles the question.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          image="system-images;android-35;default;x86_64"
          # yes reads nothing back and gets a SIGPIPE when sdkmanager stops asking, which
          # pipefail would turn into a failed step.
          ( set +o pipefail; yes | sdkmanager --licenses > /dev/null )
          sdkmanager --install "$image" platform-tools emulator
          ( set +o pipefail; echo no | avdmanager create avd -n ci -k "$image" --force )
          # avdmanager reports success whether or not an AVD landed where the emulator will
          # look for it.
          avdmanager list avd | grep -qE '^ *Name: ci$' \
            || { echo 'the AVD was not created' >&2; avdmanager list avd >&2; exit 1; }

          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          # Bounded, and with the emulator's own log on failure. An emulator that never
          # starts leaves adb blocking until the step's timeout, which turns a one-line
          # failure into a thirty-minute one that says nothing.
          timeout 300 adb wait-for-device || {
            echo 'the emulator never came up' >&2
            kill "$emulator_pid" 2>/dev/null || true
            cat emulator.log >&2
            exit 1
          }
          # wait-for-device returns as soon as adbd answers, which is long before the
          # framework is up and /data is writable.
          timeout 600 adb shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done' || {
            echo 'the emulator never finished booting' >&2
            cat emulator.log >&2
            exit 1
          }

          cargo test --release --all-targets --no-run --target '${{ matrix.target }}' \
            --message-format=json > tests.jsonl
          # The lib and integration-test binaries, which are the suite. Examples compiled as
          # tests hold none, and the criterion bench is not a libtest harness at all -- it
          # rejects the arguments below and would fail the step on its usage message.
          mapfile -t binaries < <(jq -r 'select(.executable != null)
                                         | select(.target.kind | any(. == "lib" or . == "test"))
                                         | .executable' tests.jsonl)
          test "${#binaries[@]}" -gt 0 || { echo 'no test binaries were built' >&2; exit 1; }

          remote=/data/local/tmp/embedded-mongodb
          adb shell rm -rf "$remote"
          adb shell mkdir -p "$remote"
          adb push stage/libembedded_mongodb_native.so "$remote/"
          adb shell chmod 755 "$remote/libembedded_mongodb_native.so"
          # The engine is static-libc++, but the cxx bridge inside the test binary is not.
          sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          adb push "$sysroot/${{ matrix.target }}/libc++_shared.so" "$remote/"
          # The repair probe unpacks a committed fixture whose location is a compile-time path
          # on this runner. The device has no such directory, so push it and name it below.
          adb push tests/fixtures "$remote/fixtures"
          for binary in "${binaries[@]}"; do
            name=$(basename "$binary")
            adb push "$binary" "$remote/$name"
            adb shell chmod 755 "$remote/$name"
            echo "--- $name"
            # adb shell exits 0 whatever the command did, so carry the status out by hand.
            # tr: the device's line endings are CRLF, which no anchored pattern would match.
            # EMBEDDED_MONGODB_PROBE_TMPDIR as well as TMPDIR: the durability probes take
            # their data directories from CARGO_TARGET_TMPDIR, which cargo bakes in at compile
            # time as a path on the *build host*. On the device that path is not writable, so
            # every probe fails on it. This override is why the helper has one.
            adb shell "cd $remote && LD_LIBRARY_PATH=$remote TMPDIR=$remote \
              EMBEDDED_MONGODB_PROBE_TMPDIR=$remote/probe \
              EMBEDDED_MONGODB_FIXTURE_DIR=$remote/fixtures/damaged-reopen ./$name \
              --test-threads=1; echo exit=\$?" | tr -d '\r' | tee output.txt
            grep -qx 'exit=0' output.txt || { echo "$name failed on the device" >&2; exit 1; }
          done

      - name: Stage the release assets
        run: |
          set -euo pipefail
          cp stage/libembedded_mongodb_native.so \
             "dist/libembedded_mongodb_native-${{ matrix.target }}.so"
          ( cd dist && sha256sum "libembedded_mongodb_native-${{ matrix.target }}.so" ) \
            > "dist/${{ matrix.target }}.sha256"
          printf '%s' "${{ steps.floor.outputs.glibc_min }}" > "dist/${{ matrix.target }}.glibc"

      - name: Assemble the third-party notices
        # x86_64 Linux only: the notices ship once, and this is the widest link. cpptrace and
        # libdwarf are `target_compatible_with @platforms//os:linux`, and macOS subtracts from
        # the component set rather than adding to it -- it drops the version script and LTO
        # but pulls in nothing extra. Android builds as os:linux and so links the same
        # components as this leg. A macOS-only third-party dependency would slip past this;
        # nothing in native/BUILD.bazel has one today.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          # stage/link.params was copied out during the build, so this reads a file that
          # cannot have moved. It is the link command Bazel actually ran, which is why the
          # component list cannot drift from the flags in build_native.rs.
          test -s stage/link.params || { echo 'stage/link.params is missing or empty' >&2; exit 1; }
          ./scripts/collect-third-party-notices \
            stage/link.params "${{ steps.bazel.outputs.execroot || '.' }}" mongo \
            dist/THIRD-PARTY-NOTICES

      - uses: actions/upload-artifact@v4
        # always(): a failure in one of the steps above is exactly when these are wanted, so
        # the next attempt can reuse this build instead of spending three hours repeating it.
        if: always()
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/
            stage/libembedded_mongodb_native.so
            stage/link.params
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    # Off by default. Publishing conveys the work in object form under the SSPL, so it takes
    # an explicit choice rather than following from having built successfully.
    if: inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The manifest commit is pushed as a GitHub App rather than with GITHUB_TOKEN. A push
      # made with GITHUB_TOKEN never triggers a workflow run, which left the least-reviewed
      # commit in the repository -- one CI has never seen -- sitting on master until the next
      # ordinary push. An app's push is an ordinary push.
      #
      # Needs an app installed on this repository with contents: write, and two settings on
      # it: the APP_ID variable and the APP_PRIVATE_KEY secret. Without them this step fails
      # immediately, before the release is created.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # Not just for the clone: the push at the end of this job reuses the credential
          # checkout stores, so this is what decides who the commit comes from.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - id: tag
        run: |
          set -euo pipefail
          # Key the tag on the engine's content rather than on HEAD. git ls-tree emits a tree
          # hash for each directory and the gitlink for the submodule, so identical engine
          # inputs give an identical key no matter how many unrelated commits have landed
          # since. Publishing twice from the same engine then finds the existing release and
          # reuses it, instead of minting a second tag holding byte-identical libraries --
          # which is exactly what a HEAD-derived tag did.
          key=$(git ls-tree HEAD -- patches embedded-mongodb-sys/native \
                  embedded-mongodb-sys/build_native.rs \
                  embedded-mongodb-sys/build_android.rs mongo | sha256sum | cut -c1-12)
          test -n "$key" || { echo 'could not compute an engine key' >&2; exit 1; }
          echo "engine key: $key"
          echo "tag=native-$key" >> "$GITHUB_OUTPUT"

      - name: Assemble the bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          # Collect by name, wherever the artifacts put them. The upload carries dist/ and
          # stage/ as directories, so the downloaded tree is nested rather than flat -- and a
          # glob written against one layout breaks silently when the other appears. Note the
          # dash in the pattern: it matches the per-target copies in dist/ and never
          # stage/libembedded_mongodb_native.so.
          find artifacts -type f \
            \( -name 'libembedded_mongodb_native-*.so' -o -name '*.sha256' \
               -o -name '*.glibc' -o -name 'THIRD-PARTY-NOTICES' \) \
            -exec mv -t dist/ {} +
          # Five targets, each contributing a library and a digest -- and a glibc floor for
          # the three built against glibc -- plus one notices file. Anything else means an
          # artifact was missing or a name changed.
          libraries=$(ls dist/libembedded_mongodb_native-*.so | wc -l)
          test "$libraries" -eq 5 || { echo "expected 5 libraries, found $libraries" >&2; exit 1; }
          test -s dist/THIRD-PARTY-NOTICES || { echo 'no THIRD-PARTY-NOTICES' >&2; exit 1; }
          # The licence, the modification notice and the directions to the corresponding
          # source travel with the object code. Flat files rather than an archive, so the
          # committed digest covers exactly the bytes that get mapped into a user's process.
          cp LICENSE NOTICE dist/
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected=$(cd dist && ls libembedded_mongodb_native-*.so | sort)
          if gh release view "$TAG" --json assets -q '.assets[].name' > have.txt 2>/dev/null; then
            if [ "$(grep '^libembedded_mongodb_native-.*\.so$' have.txt | sort)" = "$expected" ]; then
              # A re-run after a lost push race. The build is not byte-reproducible, so reuse
              # the bytes already published rather than uploading freshly built ones under a
              # tag someone may already have downloaded.
              echo "release $TAG is already complete; taking its assets"
              rm -f dist/libembedded_mongodb_native-*.so
              gh release download "$TAG" -D dist -p 'libembedded_mongodb_native-*.so' --clobber
              ( cd dist && for library in libembedded_mongodb_native-*.so; do
                  target=${library#libembedded_mongodb_native-}; target=${target%.so}
                  sha256sum "$library" > "$target.sha256"
                done )
            else
              echo "release $TAG exists with different assets; refusing to overwrite" >&2
              exit 1
            fi
          else
            # Not dist/*: the .sha256 and .glibc files are inputs to the manifest generator,
            # not things to publish. A digest sitting beside the binary it describes is worth
            # nothing -- whoever could replace one could replace both -- and shipping it
            # invites someone to trust it instead of the copy committed in prebuilt.rs.
            gh release create "$TAG" \
              dist/libembedded_mongodb_native-*.so dist/LICENSE dist/NOTICE \
              dist/THIRD-PARTY-NOTICES --title "native $TAG" \
              --notes "Prebuilt embedded MongoDB engine. NOTICE names the upstream commit, the applied patches and the licensing terms."
          fi

      - name: Regenerate and commit the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/write-prebuilt-manifest "$TAG" "$(git rev-parse HEAD)" dist
          # GitHub derives a bot account from the app, and the noreply address has to carry
          # that account's numeric id or the commit shows as an unrecognised author. Asked
          # for rather than hardcoded, so renaming or replacing the app needs no edit here.
          slug='${{ steps.app-token.outputs.app-slug }}[bot]'
          user_id=$(gh api "/users/$slug" --jq .id)
          test -n "$user_id" || { echo "no account for $slug" >&2; exit 1; }
          git config user.name "$slug"
          git config user.email "$user_id+$slug@users.noreply.github.com"
          git add embedded-mongodb-sys/prebuilt.rs
          git diff --cached --quiet && { echo 'manifest already current'; exit 0; }
          git commit -m "build(sys): publish prebuilt native libraries for $TAG"
          # Rebase before pushing. Hours pass between the checkout and this step, and a
          # non-fast-forward here would strand an immutable release with no manifest.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" \
               && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1

  verify:
    # Re-tests the published artifacts through the committed manifest. The manifest commit now
    # triggers ci.yml on its own -- an app's push is an ordinary push -- so this overlaps with
    # what runs there. It is kept because it is tied to this release: it starts the moment the
    # assets are published, on the ref that published them, and fails this run rather than a
    # separate one that nobody is watching.
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          # The Android rows prove the two new manifest entries download and link. Running
          # the suite needs a device, and the build job already did that on an emulator
          # against the same bytes this release holds.
          - runner: ubuntu-24.04
            target: aarch64-linux-android
          - runner: ubuntu-24.04
            target: x86_64-linux-android
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # The manifest this job re-tests names the commit it was built from, and build.rs
          # refuses to use a library it cannot place in this checkout's history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # No submodule: proving the download path needs no engine source.
      - if: '!matrix.target'
        run: cargo test --release --all-targets
      - if: matrix.target
        uses: ./.github/actions/android-ndk
        with:
          target: ${{ matrix.target }}
      - name: Download the Android library and link a test binary against it
        if: matrix.target
        run: cargo test --release --all-targets --no-run --target '${{ matrix.target }}'
      - name: Build the wheel and check the engine is inside it
        if: '!matrix.target'
        run: |
          set -euo pipefail
          # Built, not installed: the package is not on PyPI and needs a PyMongo that only
          # exists as a driver checkout. What this proves is that a wheel built against the
          # published library vendors that library, which is this pipeline's business.
          # auditwheel vendors into .libs on Linux, delocate into .dylibs on macOS.
          pip install 'maturin[patchelf]>=1.9,<2'
          maturin build --release --out wheels
          wheel=$(ls wheels/*.whl)
          python -m zipfile -l "$wheel" | grep -E 'pymongo_embedded\.(dy)?libs/.*libembedded_mongodb_native' \
            || { echo "the wheel does not carry the engine:" >&2; python -m zipfile -l "$wheel" >&2; exit 1; }
