name: ci

# Proves the prebuilt path end to end: the committed manifest still describes this tree, the
# workspace builds and tests on every published target without Bazel, and the wheel builds,
# installs and imports. No job here compiles the engine -- that is native.yml.

# workflow_dispatch because a manifest commit reaches master without one: native.yml pushes
# it with GITHUB_TOKEN, and a push made with that token never triggers a workflow run. Until
# the next ordinary push, this is the only way to check master at its actual head.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuilt-freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SOURCE_COMMIT has to be reachable.

      - name: The committed manifest must describe this tree
        run: |
          set -euo pipefail
          manifest=embedded-mongodb-sys/prebuilt.rs
          source_commit=$(sed -n 's/^const SOURCE_COMMIT: &str = "\(.*\)";$/\1/p' "$manifest")
          tag=$(sed -n 's/^const RELEASE_TAG: &str = "\(.*\)";$/\1/p' "$manifest")
          paths='patches embedded-mongodb-sys/native embedded-mongodb-sys/build_native.rs'

          if ! git rev-parse --quiet --verify "$source_commit^{commit}" > /dev/null; then
            echo "::error::$manifest names $source_commit, which is not a commit in this repository."
            exit 1
          fi

          # A pathspec of `mongo` reports a submodule pin change as a diff on that path,
          # which is why this needs no content hash over the engine.
          drift=$(git rev-list --count "$source_commit..HEAD" -- $paths mongo)
          # Not `mongo` here: applying the patches dirties the submodule's working tree, and
          # the parent reports that as a modification to the path. A moved pin is a commit,
          # so the rev-list above is what catches engine drift.
          dirty=$(git status --porcelain -- $paths)
          if [ "$drift" != 0 ] || [ -n "$dirty" ]; then
            echo "::error::The native library inputs changed, but $manifest still points at $tag."
            git log --oneline "$source_commit..HEAD" -- $paths mongo
            printf '%s\n' "$dirty"
            cat >&2 <<EOF

          Publish a build for this tree:
            gh workflow run native.yml --ref ${{ github.ref_name }} -f publish=true

          Or build the engine locally:
            EMBEDDED_MONGODB_BUILD_FROM_SOURCE=1 cargo build --release
          EOF
            exit 1
          fi
          echo "manifest is current: $tag"

      - name: NOTICE must name the pinned engine
        run: |
          set -euo pipefail
          pin=$(git rev-parse HEAD:mongo)
          grep -q "$pin" NOTICE \
            || { echo "::error::NOTICE does not name the pinned mongo commit $pin"; exit 1; }

  # Deliberately not gated on prebuilt-freshness. A stale manifest is the normal state right
  # after a submodule bump, and gating would hide every formatting and lint failure behind it.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/embedded-mongodb
          key: native-lib-x86_64-unknown-linux-gnu-${{ hashFiles('embedded-mongodb-sys/prebuilt.rs') }}
      - run: cargo fmt --all --check
      # The build script has to resolve a library before clippy can check anything that
      # depends on it, and this job exists to check the Rust, not to exercise the download.
      # --workspace is load-bearing: the root Cargo.toml is both a package and the workspace
      # root, so without it cargo checks only the root package and every member crate --
      # the bindings included -- is skipped in silence.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, cache: ~/.cache/embedded-mongodb }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, cache: ~/.cache/embedded-mongodb }
          # build.rs resolves the cache under Library/Caches on macOS; caching ~/.cache there
          # is a silent no-op that re-downloads the library on every job.
          - { target: aarch64-apple-darwin, runner: macos-15, cache: ~/Library/Caches/embedded-mongodb }
          # Android cross-compiles rather than runs: what a pull request can regress is that
          # the published library still downloads, links and matches the bridge beside it.
          # Proving the engine initialises needs a device, which native.yml does on an
          # emulator at the moment the library is built.
          - { target: aarch64-linux-android, runner: ubuntu-24.04, cache: ~/.cache/embedded-mongodb, cross: 'yes' }
          - { target: x86_64-linux-android, runner: ubuntu-24.04, cache: ~/.cache/embedded-mongodb, cross: 'yes' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5 # No submodule.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: native-lib-${{ matrix.target }}-${{ hashFiles('embedded-mongodb-sys/prebuilt.rs') }}
      - if: matrix.cross
        uses: ./.github/actions/android-ndk
        with:
          target: ${{ matrix.target }}
      # embedded-mongodb-python is excluded from the Android targets alone: pyo3 needs an
      # interpreter for the target it links against, and there is no Android CPython here.
      - if: matrix.cross
        run: cargo test --release --all-targets --no-run --workspace --exclude embedded-mongodb-python --target ${{ matrix.target }}
      - if: '!matrix.cross'
        run: cargo test --release --all-targets --workspace
      # cargo test builds no cdylib, not even under --all-targets, so the JNI library that
      # actually ships is never linked by the step above.
      - if: '!matrix.cross'
        run: cargo build --release --workspace
      - if: '!matrix.cross'
        run: cargo run --release --example basic

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, cache: ~/.cache/embedded-mongodb }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, cache: ~/.cache/embedded-mongodb }
          - { target: aarch64-apple-darwin, runner: macos-15, cache: ~/Library/Caches/embedded-mongodb }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: native-lib-${{ matrix.target }}-${{ hashFiles('embedded-mongodb-sys/prebuilt.rs') }}
      - name: Build the wheel
        run: |
          set -euo pipefail
          # One wheel per platform, so there is no per-Python matrix and no cibuildwheel: its
          # manylinux containers buy nothing here, because the prebuilt library's glibc floor
          # is already fixed by the machine that built it.
          pip install 'maturin[patchelf]>=1.9,<2'
          maturin build --release --out wheels
      - name: Check the engine was vendored into the wheel
        run: |
          set -euo pipefail
          # Not `pip install`: this package is not distributed on PyPI and is not installed
          # from it. It needs PyMongo 4.18, which exists only as a mongo-python-driver
          # checkout -- ./scripts/python is the supported way to run it. Installing the wheel
          # here would resolve some other PyMongo from PyPI and fail on a difference that
          # says nothing about this repository.
          #
          # What is worth checking is that the engine ended up inside the wheel, which is the
          # part the prebuilt pipeline is responsible for. auditwheel vendors into .libs on
          # Linux, delocate into .dylibs on macOS, so the pattern has to cover both.
          wheel=$(ls wheels/*.whl)
          python -m zipfile -l "$wheel" | grep -E 'pymongo_embedded\.(dy)?libs/.*libembedded_mongodb_native' \
            || { echo "the wheel does not carry the engine:" >&2; python -m zipfile -l "$wheel" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.runner }}
          path: wheels/*.whl

  # The Android library is a Gradle build, so nothing above compiles a line of it: `test` cross
  # compiles the JNI crate, but the AAR, the ABIs it packages and the Kotlin wrapping the bridge
  # are built and tested only here.
