<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">Traditional MongoDB deployment compared with Embedded MongoDB</title>
  <desc id="description">
    Traditional MongoDB runs the application and mongod as separate processes connected over the
    network. Embedded MongoDB places the MongoDB engine inside the application process and writes
    directly to one local data directory. After a clean shutdown, the native MongoDB data
    directory can move between Embedded MongoDB and the matching pinned mongod build.
  </desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="610" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" fill="#0f172a"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">
    Same MongoDB data. One less service.
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="82" width="510" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1"
          stroke-width="2" filter="url(#shadow)"/>
    <text x="303" y="119" text-anchor="middle" fill="#475569" font-size="15" font-weight="700"
          letter-spacing="1.4">TRADITIONAL MONGODB</text>

    <rect x="163" y="144" width="280" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd"
          stroke-width="2"/>
    <text x="303" y="179" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">
      Your application
    </text>

    <path d="M303 203 V245" fill="none" stroke="#64748b" stroke-width="2.5"
          marker-end="url(#arrow-gray)"/>
    <text x="320" y="228" fill="#64748b" font-size="13">network + connection string</text>

    <rect x="163" y="253" width="280" height="68" rx="12" fill="#f1f5f9" stroke="#94a3b8"
          stroke-width="2"/>
    <text x="303" y="281" text-anchor="middle" fill="#334155" font-size="19" font-weight="700">
      MongoDB server
    </text>
    <text x="303" y="304" text-anchor="middle" fill="#64748b" font-size="14">
      mongod · separate process
    </text>

    <path d="M303 322 V350" fill="none" stroke="#64748b" stroke-width="2.5"
          marker-end="url(#arrow-gray)"/>

    <path d="M233 365 C233 353 373 353 373 365 V398 C373 411 233 411 233 398 Z"
          fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="303" cy="365" rx="70" ry="12" fill="#e2e8f0" stroke="#94a3b8"
             stroke-width="2"/>
    <text x="303" y="392" text-anchor="middle" fill="#334155" font-size="15" font-weight="600">
      data directory
    </text>

    <rect x="139" y="435" width="328" height="38" rx="19" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="303" y="460" text-anchor="middle" fill="#be123c" font-size="15" font-weight="700">
      2 processes · separate lifecycle
    </text>

    <rect x="642" y="82" width="510" height="410" rx="20" fill="#ffffff" stroke="#6ee7b7"
          stroke-width="2" filter="url(#shadow)"/>
    <text x="897" y="119" text-anchor="middle" fill="#047857" font-size="15" font-weight="700"
          letter-spacing="1.4">EMBEDDED MONGODB</text>

    <rect x="707" y="144" width="380" height="177" rx="16" fill="#ecfdf5" stroke="#34d399"
          stroke-width="2"/>
    <text x="897" y="174" text-anchor="middle" fill="#065f46" font-size="18" font-weight="700">
      Your application
    </text>

    <rect x="757" y="195" width="280" height="100" rx="13" fill="#ffffff" stroke="#6ee7b7"
          stroke-width="2"/>
    <text x="897" y="231" text-anchor="middle" fill="#065f46" font-size="20" font-weight="700">
      embedded-mongodb
    </text>
    <text x="897" y="258" text-anchor="middle" fill="#047857" font-size="15">
      MongoDB engine + WiredTiger
    </text>
    <text x="897" y="280" text-anchor="middle" fill="#64748b" font-size="13">
      in the same process
    </text>

    <path d="M897 322 V350" fill="none" stroke="#059669" stroke-width="2.5"
          marker-end="url(#arrow-green)"/>

    <path d="M827 365 C827 353 967 353 967 365 V398 C967 411 827 411 827 398 Z"
          fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="897" cy="365" rx="70" ry="12" fill="#a7f3d0" stroke="#10b981"
             stroke-width="2"/>
    <text x="897" y="392" text-anchor="middle" fill="#065f46" font-size="15" font-weight="600">
      ./data
    </text>

    <rect x="753" y="435" width="288" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="897" y="460" text-anchor="middle" fill="#047857" font-size="15" font-weight="700">
      1 process · 1 local directory
    </text>

    <rect x="210" y="516" width="780" height="68" rx="18" fill="#ecfdf5" stroke="#34d399"
          stroke-width="2"/>
    <path d="M250 550 H310" fill="none" stroke="#059669" stroke-width="3"
          marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <text x="340" y="544" fill="#065f46" font-size="18" font-weight="700">
      Native MongoDB data directory
    </text>
    <text x="340" y="567" fill="#047857" font-size="14">
      embedded-mongodb ↔ pinned mongod · clean shutdown · one owner at a time
    </text>
  </g>
</svg>
