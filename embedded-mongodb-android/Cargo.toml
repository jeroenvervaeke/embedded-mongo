[package]
name = "embedded-mongodb-android"
version = "0.1.0"
edition = "2024"
license = "SSPL-1.0"
publish = false

[lib]
name = "embedded_mongodb_android"
# `rlib` as well as `cdylib`: the host test suite and the panic probe below link the same
# code the Android library exports, so what the tests exercise is what ships.
crate-type = ["cdylib", "rlib"]

# The shared library the JVM tests load: `cargo test` builds a package's `rlib` but not its
# `cdylib`, and this links that same `rlib`. It also carries the deliberate panic, which keeps
# a panic backdoor out of the library Android loads. See `examples/jni_probe.rs`.
[[example]]
name = "jni_probe"
crate-type = ["cdylib"]

[dependencies]
# The safe crate, not the raw FFI one: opening through it is what runs the one-time index
# repair pass. `embedded-mongodb-sys` stays alongside it because `error.rs` names the engine
# exception that `embedded_mongodb::Error::Native` carries.
embedded-mongodb = { path = ".." }
embedded-mongodb-sys = { path = "../embedded-mongodb-sys" }
jni = "0.22.4"

# The JVM tests unpack the committed damaged directory from `tests/fixtures` and drive the
# bridge over it, through the same helper the root crate's repair tests use.
[dev-dependencies]
flate2 = "1"
tempfile = "3"
