[package]
name = "embedded-mongodb-python"
version = "0.1.0"
edition = "2024"
license = "SSPL-1.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bson = "3.1.0"
embedded-mongodb-sys = { path = "../embedded-mongodb-sys" }
pyo3 = { version = "0.29.0", features = ["abi3-py39", "extension-module"] }
