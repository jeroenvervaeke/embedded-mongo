[package]
name = "embedded-mongodb-sys"
version = "0.1.0"
edition = "2024"
description = "Native bindings for embedded-mongodb"
license = "SSPL-1.0"
publish = false
links = "embedded_mongodb_native"

[dependencies]
cxx = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# Only the tests speak BSON: this crate's own surface is bytes in, bytes out. `serverStatus`
# is the only way to ask WiredTiger what it was actually configured with.
bson = "3.1.0"
tempfile = "3"

[build-dependencies]
cxx-build = "1"
sha2 = "0.10"
